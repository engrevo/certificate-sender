services:
  - type: web
    name: certificate-sender
    runtime: docker
    plan: free
    healthCheckPath: /login
    envVars:
      - key: APP_PASSWORD
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DRY_RUN
        value: "1"
      - key: DATA_DIR
        value: /tmp/data
      - key: OUTBOX_DIR
        value: /tmp/data/outbox
      - key: DEFAULT_COUNTRY_CODE
        value: "966"
      - key: WHATSAPP_SEND_MODE
        value: template
      - key: WHATSAPP_TEMPLATE_NAME
        value: attendance_certificate
      - key: WHATSAPP_TEMPLATE_LANG
        value: ar
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
