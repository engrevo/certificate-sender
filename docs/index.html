<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>مِرسال — إصدار وإرسال شهادات الحضور</title>
  <meta name="description" content="مِرسال: منصّة تُصدر شهادات الحضور باسم كل مشارك وترسلها إليه مباشرة عبر واتساب.">
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #f5f6f8; --ink: #1d2433; --muted: #667085; --brand: #1f6f5c; --tint: #e7f2ef; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
      font-family: "Tajawal", "Segoe UI", Tahoma, system-ui, sans-serif; color: var(--ink); line-height: 1.7;
      background: linear-gradient(180deg, var(--tint) 0, var(--bg) 360px); }
    main { max-width: 620px; text-align: center; }
    h1 { margin: 0; font-size: 2.6rem; color: var(--brand); }
    .tag { display: inline-block; margin-top: 6px; font-weight: 700; padding: 2px 14px; border-radius: 999px; background: #fff; }
    p { color: var(--muted); font-size: 1.1rem; }
  </style>
</head>
<body>
  <main>
    <img src="logo.svg" alt="" width="88" height="88" style="display:block;margin:0 auto 12px;border-radius:22px">
    <h1>مِرسال</h1>
    <span class="tag">إصدار وإرسال شهادات الحضور</span>
    <p>صمّم مرة، وأرسل للجميع. يحوّل مِرسال تصميم شهادتك وقائمة الحضور إلى شهادات مخصّصة باسم كل مشارك، ويوصلها إليه مباشرة عبر واتساب، بدقة واحترافية ودون أي جهد يدوي.</p>
  </main>
</body>
</html>
